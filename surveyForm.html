<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">Village survey</h1>
    <p id ="description">We visited a village for a survey. There, we met several farmers. They shared information about their livelihoods with us. They told us that their primary method of earning a living is through farming.</p>
    <form id ="survey-form">
      <label id="name-label">Name: </label>
     <input type="text" id="name" placeholder="Enter your name here" required><br>
     <label id ="email-label">Email: </label>
     <input type="email" id="email" placeholder="Enter your email here"required><br>
     <label id ="number-label">Number: </label>
     <input type="number" id="number" min="5" max="15" placeholder="Enter the number here"><br>
     <label>Are you farmer or not?</label>
     <select id="dropdown">
      <option>Yes</option>
      <option>No</option>
     </select><br>
     <label>Please select your gender: </label>
     <input type="radio" value="male" name="Gender">Male
     <input type="radio" value="female" name="Gender">Female
     <label>Choose one from below: </label><br>
     <input type="checkbox" name="rich"value="rich">
     <label for="rich">Rich</label>
     <input type="checkbox" name="middle-class"value="middle-class">
     <label for="middle-class">Middle-class</label>
     <input type="checkbox" name="poor"value="poor">
     <label for="poor">Poor</label>
     <input type="checkbox" name="Very-poor"value="Very-poor">
     <label for="Very-poor">Very-poor</label><br>
     <textarea>This is survey form of a village.</textarea><br>
     <button id="submit">Submit</button>
     
    </form>
  </body>
</html>
